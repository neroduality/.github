# Org lint kit ruff config for consumer Python (helper/build/test scripts).
# Applied explicitly by the python_lint job (ruff check --config <kit>/config/ruff.toml),
# so a consumer's own pyproject.toml never changes the enforced rule set.

target-version = "py311"
line-length = 100
extend-exclude = ["build", "third-party"]

[lint]
# High-signal correctness + modernization; excludes opinionated/formatter-adjacent
# families (COM trailing-comma, pathlib migration) to stay low-noise.
select = ["E", "F", "W", "I", "UP", "B", "SIM", "C4", "RUF", "PIE"]
