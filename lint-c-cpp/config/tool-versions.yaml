# Minimum host lint tool versions for the org C/C++ lint kit.

tools:
  clang_format:
    binaries:
      - clang-format
      - clang-format-20
      - clang-format-21
    min: "20.0.0"
  clang_tidy:
    binaries:
      - clang-tidy
      - clang-tidy-21
    min: "21.0.0"
  cmake:
    min: "3.20"
  codespell:
    min: "2.4.2"
  cppcheck:
    min: "2.19.1"
  markdownlint:
    min: "0.48.0"
  make:
    min: "4.0"
  node:
    min: 20
  python3:
    min: "3.10"
  shellcheck:
    min: "0.9.0"
  shfmt:
    min: "3.0.0"
