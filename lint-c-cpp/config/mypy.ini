# Org lint kit mypy config for consumer Python (helper/build/test scripts).
# Applied explicitly by the python_lint job (mypy --config-file <kit>/config/mypy.ini).
# Pragmatic (not --strict): catches real type errors on unannotated scripts without
# demanding full annotation coverage of existing helpers.

[mypy]
python_version = 3.11
exclude = (^|/)(build|third-party)/
warn_redundant_casts = True
warn_unused_ignores = True
warn_unreachable = True
no_implicit_optional = True
check_untyped_defs = True
# Build-time-only third-party imports (e.g. yaml) must not fail the type check.
ignore_missing_imports = True
