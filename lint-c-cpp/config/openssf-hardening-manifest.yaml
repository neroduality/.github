#
# OpenSSF hardening manifest (kit-owned). Consumers do not edit this file.
# Dial tokens only via policy.overrides.openssf-hardening (add / remove /
# by_compile_db). See config/README.md for dialed artifact locations.
#
# Top-level keys
# --------------
# guide      Guide metadata (date, URL, normative tables).
# coverage   Token allowlist shared by the lint audit and dialed emit.
#            Lint requires these tokens; Hardening emit uses the same set
#            after dials are applied.
# consumer   Required checked-in module basenames under cmake_dir.
# cmake      How each coverage token is wired in FULL kit templates
#            (bare compile, compile_arch, probe / genex, link).
#
# Dialed consumer copies (fail-on-change rewrite on lint)
# ------------------------------------------------------
#   cmake/Hardening.cmake                 Kit baseline + global dials
#   cmake/Hardening.by-<slug>.cmake       + that compile_db's by_compile_db
#   cmake/Hardening.flags.by-<slug>.mk    Same dials as NERO_OPENSSF_* (Make)
#   cmake/CompilerHardeningProbes.cmake   Kit FULL probes (byte-match)
#
# Wire by_compile_db with a CMake include of Hardening.by-<slug>.cmake, or a
# Make include of Hardening.flags.by-<slug>.mk (Arduino has no MCU CMake path).
#
# Emit notes
# ----------
# - compile_arch (e.g. -fcf-protection): host + arch gated; never ungated on cross.
# - NOT_FHARDENED is per language (HAVE_{LANG}_FHARDENED). CXX fortify flags and
#   the C++ stdlib defs already implied by -fhardened follow HAVE_CXX_FHARDENED
#   (avoids -Werror=hardened). The C probe does not stand in for the CXX one.
# - -fhardened / -Whardened: probe AND NOT instrumented sanitizer AND the same
#   optimized configs as _FORTIFY_SOURCE (at -O0, -fhardened cannot enable
#   _FORTIFY_SOURCE and -Whardened turns that into a -Werror failure).
# - Lint also materializes a dialed openssf-hardening-manifest.yaml under
#   build/lint-overrides/ for the audit; that is not a substitute for cmake/.

guide:
  date: "2026-08-20"
  url: "https://best.openssf.org/Compiler-Hardening-Guides/Compiler-Options-Hardening-Guide-for-C-and-C++.html"
  normative_tables: [1, 2]

# Token allowlist: lint audit and dialed Hardening emit share this set.
coverage:
  flags:
    - -Wall
    - -Wextra
    - -Wformat
    - -Wformat=2
    - -Wconversion
    - -Wsign-conversion
    - -Wtrampolines
    - -Wimplicit-fallthrough
    - -Wbidi-chars=any
    # -Werror=vla enables -Wvla; do not also list the plain warning form.
    - -Werror=vla
    - -Walloca
    - -Wshadow
    - -Wundef
    - -Wformat-signedness
    - -Wstrict-prototypes
    - -Wold-style-definition
    - -Werror
    - -Werror=format-security
    - -Werror=implicit
    - -Werror=incompatible-pointer-types
    - -Werror=int-conversion
    - -O2
    - -ffunction-sections
    - -fdata-sections
    - -U_FORTIFY_SOURCE
    - -D_FORTIFY_SOURCE=3
    - -fstrict-flex-arrays=3
    - -fstack-clash-protection
    - -fstack-protector-strong
    - -fcf-protection=full
    - -mbranch-protection=standard
    - -fzero-call-used-regs=used-gpr
    - "LINKER:-z,nodlopen"
    - "LINKER:-z,noexecstack"
    - "LINKER:-z,relro"
    - "LINKER:-z,now"
    - "LINKER:--gc-sections"
    - "LINKER:-z,pack-relative-relocs"
    - "LINKER:-z,text"
    - "LINKER:--error-execstack"
    - "LINKER:--error-rwx-segments"
    - -fPIE
    - -pie
    - -fPIC
    - -shared
    - -fno-delete-null-pointer-checks
    - -fno-strict-overflow
    - -fno-strict-aliasing
    - -ftrivial-auto-var-init=zero
    - -fexceptions
    - -fhardened
    - "LINKER:--as-needed"
    - "LINKER:--no-copy-dt-needed-entries"
    - -fzero-init-padding-bits=all
    - -Whardened
    - -Werror=trampolines
    - -fzero-init-padding-bits=unions
  definitions:
    - _GLIBCXX_ASSERTIONS
    - _LIBCPP_HARDENING_MODE=_LIBCPP_HARDENING_MODE_FAST
    - _LIBCPP_HARDENING_MODE=_LIBCPP_HARDENING_MODE_EXTENSIVE
    - _GLIBCXX_DEBUG
    - _LIBCPP_HARDENING_MODE=_LIBCPP_HARDENING_MODE_DEBUG

# Required checked-in modules under cmake_dir. Probes must byte-match the kit;
# Hardening.cmake matches global dials. Each by_compile_db entry also requires
# Hardening.by-<slug>.cmake and Hardening.flags.by-<slug>.mk.
consumer:
  cmake_dir: cmake
  required_modules:
    - CompilerHardeningProbes.cmake
    - Hardening.cmake

# FULL kit wiring templates. Consumer dialed copies filter to dialed coverage.
# compile_arch entries become host+arch genex in generated Hardening (not bare
# on cross compiles).
cmake:
  common:
    compile:
      - -Wall
      - -Wextra
      - -Wformat
      - -Wformat=2
      - -Wconversion
      - -Wsign-conversion
      - -Wimplicit-fallthrough
      - -Werror
      - -Werror=format-security
      - -fno-delete-null-pointer-checks
      - -fno-strict-overflow
      - -fno-strict-aliasing
      - -fstack-protector-strong
    compile_arch:
      x86_64_native:
        - -fcf-protection=full
    compile_probe_gated:
      - flag: -Wbidi-chars=any
        probe: HAVE_{LANG}_WBIDI_CHARS_ANY
      # Zero caller-used GPRs on return: limits register-resident data lifetime
      # (the register half of a secure_clear) and ROP gadget value. The guide
      # lists it for x86_64/aarch64; GCC also implements it on s390/ppc/riscv
      # (release-dependent), so gate on the per-toolchain probe rather than an
      # arch key -- unsupported targets fail the probe ("sorry, unimplemented")
      # and omit it. Firmware toolchains without it dial it out per compile_db.
      - flag: -fzero-call-used-regs=used-gpr
        probe: HAVE_{LANG}_ZERO_CALL_USED_REGS
      - flag: -ffunction-sections
        probe: HAVE_{LANG}_FUNCTION_SECTIONS
      - flag: -fdata-sections
        probe: HAVE_{LANG}_DATA_SECTIONS
      - flag: -Werror=vla
        probe: HAVE_{LANG}_WERROR_VLA
      - flag: -Walloca
        probe: HAVE_{LANG}_WALLOCA
      - flag: -Wshadow
        probe: HAVE_{LANG}_WSHADOW
      - flag: -Wundef
        probe: HAVE_{LANG}_WUNDEF
      - flag: -Wformat-signedness
        probe: HAVE_{LANG}_WFORMAT_SIGNEDNESS
      - flag: -Wtrampolines
        probe: HAVE_{LANG}_WTRAMPOLINES
      - flag: -Werror=trampolines
        probe: HAVE_{LANG}_WERROR_TRAMPOLINES
      - flag: -fstack-clash-protection
        probe: HAVE_{LANG}_STACK_CLASH_PROTECTION
      - flag: -fstrict-flex-arrays=3
        probe: HAVE_{LANG}_STRICT_FLEX_ARRAYS_3
      - flag: -ftrivial-auto-var-init=zero
        probe: HAVE_{LANG}_TRIVIAL_AUTO_VAR_INIT_ZERO
      - flag: -fzero-init-padding-bits=all
        probe: HAVE_{LANG}_ZERO_INIT_PADDING_BITS_ALL
      # The guide's option table spells this "union"; GCC 15 accepts only "unions"
      # (and the guide's own synopsis uses that spelling). Emitted only when
      # =all is unavailable: both on one command line, and =unions wins.
      - flag: -fzero-init-padding-bits=unions
        probe: HAVE_{LANG}_ZERO_INIT_PADDING_BITS_UNION
      - flag: -fhardened
        probe: HAVE_{LANG}_FHARDENED
      - flag: -Whardened
        probe: HAVE_{LANG}_WHARDENED
      - flag: -mbranch-protection=standard
        probe: HAVE_ARM_BRANCH_PROTECTION_STANDARD
    compile_genex_gated:
      # Speed-optimized configs only: target options follow CMAKE_C_FLAGS_<CONFIG>,
      # so -O2 would override MinSizeRel's -Os (which still optimizes enough for
      # _FORTIFY_SOURCE). Debug keeps -O0.
      - flag: -O2
        gate_requires: [CMAKE_CROSSCOMPILING, CONFIG:Release, CONFIG:RelWithDebInfo]
      - flag: -U_FORTIFY_SOURCE
        gate_requires:
          [CMAKE_CROSSCOMPILING, CONFIG:Release, CONFIG:RelWithDebInfo, CONFIG:MinSizeRel, NOT_INSTRUMENTED_SANITIZER, NOT_FHARDENED]
      - flag: -D_FORTIFY_SOURCE=3
        gate_requires:
          [CMAKE_CROSSCOMPILING, CONFIG:Release, CONFIG:RelWithDebInfo, CONFIG:MinSizeRel, NOT_INSTRUMENTED_SANITIZER, NOT_FHARDENED]
      - flag: -fPIE
        gate_requires: [TARGET_PROPERTY:TYPE, EXECUTABLE]
      - flag: -fPIC
        gate_requires: [TARGET_PROPERTY:TYPE, SHARED_LIBRARY]
    link_probe_gated:
      - flag: "LINKER:--as-needed"
        probe: HAVE_LINK_AS_NEEDED
      - flag: "LINKER:--no-copy-dt-needed-entries"
        probe: HAVE_LINK_NO_COPY_DT_NEEDED
      - flag: "LINKER:-z,nodlopen"
        probe: HAVE_LINK_Z_NODLOPEN
      - flag: "LINKER:--gc-sections"
        probe: HAVE_LINK_GC_SECTIONS
      # Host-only by default (see OPENSSF_HOST_ONLY_FLAGS): DT_RELR needs a
      # glibc >= 2.36 loader. Emitted only when the linker probe AND the sysroot
      # libc probe (HAVE_LIBC_DT_RELR, features.h __GLIBC_PREREQ(2,36)) pass AND
      # the build is native. The libc probe is required because GNU ld adds the
      # GLIBC_ABI_DT_RELR verneed even against older glibc, so the link succeeds
      # and the loader rejects the ELF. Consumers whose cross sysroots are known
      # >= 2.36 lift the native term via policy.overrides.openssf-hardening.cross;
      # bare-metal / firmware consumers additionally dial it out (with
      # --gc-sections) per compile_db via by_compile_db.remove.
      - flag: "LINKER:-z,pack-relative-relocs"
        probe: HAVE_LINK_Z_PACK_RELATIVE_RELOCS
      - flag: "LINKER:-z,text"
        probe: HAVE_LINK_Z_TEXT
      - flag: "LINKER:--error-execstack"
        probe: HAVE_LINK_ERROR_EXECSTACK
      - flag: "LINKER:--error-rwx-segments"
        probe: HAVE_LINK_ERROR_RWX_SEGMENTS
    link_genex_gated:
      # Host-only by default (see OPENSSF_HOST_ONLY_GENEX_FLAGS): these need an ELF
      # dynamic loader, so bare-metal / firmware cross targets never see them. Linux
      # userspace cross ports (deb/rpm foreign-arch packages) opt them back in via
      # policy.overrides.openssf-hardening.cross, which lifts only the
      # CMAKE_CROSSCOMPILING term (the TARGET_PROPERTY:TYPE term on -pie stays).
      - flag: -pie
        gate_requires: [TARGET_PROPERTY:TYPE, EXECUTABLE, CMAKE_CROSSCOMPILING]
      - flag: "LINKER:-z,noexecstack"
        gate_requires: [CMAKE_CROSSCOMPILING]
      - flag: "LINKER:-z,now"
        gate_requires: [CMAKE_CROSSCOMPILING]
      - flag: "LINKER:-z,relro"
        gate_requires: [CMAKE_CROSSCOMPILING]
      - flag: -shared
        gate_requires: [TARGET_PROPERTY:TYPE, SHARED_LIBRARY]

  C:
    compile_probe_gated:
      - flag: -Werror=implicit
        probe: HAVE_C_WERROR_IMPLICIT
      - flag: -Werror=incompatible-pointer-types
        probe: HAVE_C_WERROR_INCOMPATIBLE_POINTER_TYPES
      - flag: -Werror=int-conversion
        probe: HAVE_C_WERROR_INT_CONVERSION
      - flag: -Wstrict-prototypes
        probe: HAVE_C_WSTRICT_PROTOTYPES
      - flag: -Wold-style-definition
        probe: HAVE_C_WOLD_STYLE_DEFINITION
    compile_genex_gated:
      - flag: -fexceptions
        gate_requires: [CMAKE_CROSSCOMPILING]

  CXX:
    definitions_genex_gated:
      # -fhardened already enables these; explicit -D trips -Werror=hardened.
      - definition: _GLIBCXX_ASSERTIONS
        gate_requires:
          [CMAKE_CROSSCOMPILING, CONFIG:Release, CONFIG:RelWithDebInfo, CONFIG:MinSizeRel, NOT_FHARDENED]
      - definition: _LIBCPP_HARDENING_MODE=_LIBCPP_HARDENING_MODE_FAST
        gate_requires: [CMAKE_CROSSCOMPILING, CONFIG:Production, NOT_FHARDENED]
      - definition: _LIBCPP_HARDENING_MODE=_LIBCPP_HARDENING_MODE_EXTENSIVE
        gate_requires: [CMAKE_CROSSCOMPILING, CONFIG:RelWithDebInfo, NOT_FHARDENED]
      - definition: _GLIBCXX_DEBUG
        gate_requires: [CMAKE_CROSSCOMPILING, CONFIG:Debug]
      - definition: _LIBCPP_HARDENING_MODE=_LIBCPP_HARDENING_MODE_DEBUG
        gate_requires: [CMAKE_CROSSCOMPILING, CONFIG:Debug]
